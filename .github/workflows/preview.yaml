name: Netlify

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  statuses: write # to attach the preview URL to the commit

# Only keep the latest deployment of a branch running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    # Secrets are not available to forks and Dependabot pushes
    if: github.repository_owner == 'zazuko' && github.actor != 'dependabot[bot]'
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Apply pending changesets
        # Lets the preview show the upcoming version and changelog. `changeset version` fails when there is nothing to apply.
        run: |
          if [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md')" ]; then
            npx changeset version
          else
            echo "No pending changesets"
          fi

      - name: Build
        run: npm run build --workspace packages/app

      - name: Compute deploy alias
        id: alias
        env:
          REF_NAME: ${{ github.ref_name }}
        # Netlify aliases must be DNS-safe: lowercase alphanumerics and hyphens, at most 37 characters
        run: |
          alias=$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | cut -c1-37 | sed -E 's/^-+//; s/-+$//')
          echo "alias=${alias:-preview}" >> "$GITHUB_OUTPUT"

      - name: Install Netlify CLI
        run: npm install --global netlify-cli@27

      - name: Deploy preview to Netlify
        id: deploy
        env:
          DEPLOY_ALIAS: ${{ steps.alias.outputs.alias }}
          DEPLOY_MESSAGE: "Preview of ${{ github.ref_name }} (${{ github.sha }})"
        run: |
          netlify deploy --no-build --dir packages/app/dist --alias "$DEPLOY_ALIAS" --message "$DEPLOY_MESSAGE" --json > deploy.json
          url=$(jq -r '.deploy_url' deploy.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview deployed to <$url>" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach preview URL to the commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context="Netlify Site" \
            -f description="Preview deployed" \
            -f target_url="$TARGET_URL"
